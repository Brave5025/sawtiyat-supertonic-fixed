name: Build Sawtiyat APK 0.7.23

on:
  push:
    branches: [ "build-0.7.22", "build-0.7.23" ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble, verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat sawtiyat-upload-01.part sawtiyat-upload-02.part sawtiyat-upload-03.part sawtiyat-upload-04.part sawtiyat-upload-05.part sawtiyat-upload-06.part > source.zip
          unzip -t source.zip
          mkdir source
          unzip -q source.zip -d source
          test -f source/Sawtiyat-0.7.14-source/gradlew

      - name: Apply 0.7.21 base corrections
        run: python3 tools/patch_0_7_21.py

      - name: Apply Supertonic 0.7.22 audio fixes
        run: python3 tools/patch_0_7_22.py

      - name: Apply 0.7.23 model-download integrity fixes
        run: python3 tools/patch_0_7_23.py

      - name: Verify version identity
        working-directory: source/Sawtiyat-0.7.14-source
        run: |
          grep -q 'versionCode = 39' app/build.gradle.kts
          grep -q 'versionName = "0.7.23"' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build installable debug APK
        working-directory: source/Sawtiyat-0.7.14-source
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sawtiyat-0.7.23-debug-APK
          path: source/Sawtiyat-0.7.14-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
